<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ธุรการ ป สภ.เมืองนครนายก</title>
    
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100vh; width: 100vw; 
            overflow: hidden; background-color: #f4f4f9; 
            
            /* --- จุดสำคัญ: ป้องกัน Chrome มือถือเข้าใจผิดเรื่องการลาก --- */
            /* บอก Chrome ว่าไม่ต้องพยายามเดาว่าเราจะลากหรือจะซูม ให้ส่งค่าการแตะไปที่ iframe ทันที */
            touch-action: pan-x pan-y; 
            -webkit-user-select: none;
            user-select: none;
        }

        .app-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            /* ป้องกันการ Drag ระดับ Container */
            touch-action: none; 
        }

        iframe {
            width: 100%; height: 100%; border: none; display: block;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbw3n1KliQeJYBGHBfQh4FzOWjIU9BNty5uYXUsjUijIAhcMuzp5EaGIkRAJK4pSS-_XsQ/exec"
            allow="geolocation; microphone; camera; clipboard-write" 
            loading="eager">
        </iframe>
    </div>

    <script>
        // ปิดระบบ Drag & Drop ที่ระดับ Window อย่างสิ้นเชิงเพื่อไม่ให้ Chrome เก็บ State
        const killEvent = (e) => {
            e.preventDefault();
            e.stopPropagation();
        };

        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(event => {
            window.addEventListener(event, killEvent, { passive: false });
        });

        // แก้ปัญหาปุ่มค้าง: เมื่อมีการปล่อยนิ้ว ให้เคลียร์สถานะทั้งหมด
        window.addEventListener('touchend', () => {
            // บังคับให้ Chrome ลืมสถานะการกดค้าง
            window.focus();
        }, { passive: true });
    </script>
</body>
</html>
