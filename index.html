<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ธุรการ ป สภ.เมืองนครนายก</title>
    <meta name="robots" content="noindex, nofollow">
    
    <style>
        /* ล้างค่าเริ่มต้นและป้องกันการ Bounce ของจอ */
        html, body { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%;
            overflow: hidden; /* ป้องกันสกอร์บาร์ซ้อนกัน */
            background-color: #f4f4f9; /* ใส่สีพื้นหลังอ่อนๆ ลดอาการวูบขาว */
        }

        /* ปรับปรุง Container ของ iframe */
        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            -webkit-overflow-scrolling: touch; /* สำคัญ: ทำให้ iOS Scroll ลื่นเหมือนแอปปกติ */
            overflow-y: auto;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            /* ใช้ hardware acceleration ช่วยลดอาการกระตุก */
            transform: translateZ(0); 
            -webkit-transform: translateZ(0);
        }
    </style>
</head>
<body>

    <div class="iframe-container">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbw3n1KliQeJYBGHBfQh4FzOWjIU9BNty5uYXUsjUijIAhcMuzp5EaGIkRAJK4pSS-_XsQ/exec"
            allow="geolocation; microphone; camera" 
            loading="lazy">
        </iframe>
    </div>

</body>
</html>
