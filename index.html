<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ธุรการ ป สภ.เมืองนครนายก</title>
    <meta name="robots" content="noindex, nofollow">
    
    <style>
        /* 1. บังคับหน้าจอให้เต็มเป๊ะและห้าม Scroll เกิน */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            background-color: #f4f4f9; 
            /* ป้องกันการกดค้างแล้วขึ้นแว่นขยายหรือเมนูเลือกคำ */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        /* 2. ตัวคลุม iframe ให้แสดงผลเต็มพื้นที่ */
        .app-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbw3n1KliQeJYBGHBfQh4FzOWjIU9BNty5uYXUsjUijIAhcMuzp5EaGIkRAJK4pSS-_XsQ/exec"
            allow="geolocation; microphone; camera; clipboard-write" 
            loading="eager">
        </iframe>
    </div>

    <script>
        /**
         * 3. ส่วนป้องกันอาการค้าง: ปิดระบบ Drag and Drop อย่างเด็ดขาด
         */
        const disableDrag = (e) => {
            // เช็คว่าถ้ามีการพยายามลากไฟล์มา ให้สั่งยกเลิกทันที
            e.preventDefault();
            e.stopPropagation();
        };

        // สั่งปิดเหตุการณ์ลากวางทั้งหมดที่ระดับ Window
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            window.addEventListener(eventName, disableDrag, { passive: false });
        });

        // ปิดเมนูกดค้าง (Context Menu) เพื่อไม่ให้ Chrome มือถือหน่วง
        window.oncontextmenu = function(e) {
            if (e.target.tagName !== 'IFRAME') {
                e.preventDefault();
                return false;
            }
        };
    </script>
</body>
</html>
