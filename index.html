<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ธุรการ ป สภ.เมืองนครนายก</title>
    <meta name="robots" content="noindex, nofollow">
    
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100vh; width: 100vw; 
            overflow: hidden; background-color: #f4f4f9; 
        }
        .iframe-container {
            width: 100%; height: 100%;
            -webkit-overflow-scrolling: touch;
        }
        iframe {
            width: 100%; height: 100%; border: none;
            transform: translateZ(0); -webkit-transform: translateZ(0);
        }
    </style>
</head>
<body>

    <div class="iframe-container">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbw3n1KliQeJYBGHBfQh4FzOWjIU9BNty5uYXUsjUijIAhcMuzp5EaGIkRAJK4pSS-_XsQ/exec"
            allow="geolocation; microphone; camera; clipboard-write" 
            loading="eager">
        </iframe>
    </div>

    <script>
        // ป้องกัน Browser ค้างเมื่อมีการ Drag ไฟล์หลุดนอก iframe
        window.addEventListener("dragover", e => e.preventDefault(), false);
        window.addEventListener("drop", e => e.preventDefault(), false);
    </script>
</body>
</html>
