<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ธุรการ ป สภ.เมืองนครนายก</title>
    <meta name="robots" content="noindex, nofollow">
    
    <style>
        /* ล้างค่าเริ่มต้นและล็อคขนาดหน้าจอให้พอดีเป๊ะ */
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            background-color: #f4f4f9; 
        }

        /* Container สำหรับคุม iframe */
        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* ทำให้การเลื่อนใน iOS ลื่นเหมือนแอปจริง */
            -webkit-overflow-scrolling: touch;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            /* ใช้ Hardware Acceleration ช่วยให้ Chrome ประมวลผลลื่นขึ้น */
            transform: translateZ(0); 
            -webkit-transform: translateZ(0);
        }
    </style>
</head>
<body>

    <div class="iframe-container">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbw3n1KliQeJYBGHBfQh4FzOWjIU9BNty5uYXUsjUijIAhcMuzp5EaGIkRAJK4pSS-_XsQ/exec"
            /* เปิดสิทธิ์ที่จำเป็นทั้งหมด รวมถึง Clipboard สำหรับการก๊อปปี้ข้อความ */
            allow="geolocation; microphone; camera; clipboard-write; display-capture" 
            loading="eager">
        </iframe>
    </div>

    <script>
        /**
         * ป้องกัน Chrome ค้างจากการลากไฟล์ (Drag and Drop)
         * โดยเฉพาะเมื่อลากไฟล์หลุดออกนอกขอบของระบบจัดการไฟล์ใน iframe
         */
        const preventGlobalDrag = (e) => {
            // ดักจับเฉพาะตอนที่มีการลากไฟล์จริงๆ
            if (e.dataTransfer && e.dataTransfer.types && e.dataTransfer.types.includes('Files')) {
                e.preventDefault();
                e.stopPropagation();
            }
        };

        // ใช้ { passive: false } เพื่อบังคับให้ Chrome หยุดพฤติกรรมมาตรฐาน (เช่น การพยายามเปิดไฟล์)
        window.addEventListener("dragover", preventGlobalDrag, { passive: false });
        window.addEventListener("drop", preventGlobalDrag, { passive: false });

        // ป้องกันอาการ "วูบ" หรือ "ค้าง" เมื่อมีการกดค้างบนพื้นที่ว่างใน Chrome มือถือ
        window.oncontextmenu = function(event) {
            if (event.target.tagName !== 'IFRAME') {
                event.preventDefault();
                event.stopPropagation();
                return false;
            }
        };
    </script>
</body>
</html>
